#!/usr/bin/env python3
PACKAGE = "cerulean_sonar_ros"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("start_range_meters", double_t, 0, "Minimum range in meters", 0.0, 0.0, 100.0)
gen.add("end_range_meters", double_t, 0, "Maximum range in meters", 50.0, 1.0, 200.0)
gen.add("num_data_points", int_t, 0, "Number of data points", 600, 200, 1200)
gen.add("speed_of_sound", int_t, 0, "Speed of sound in m/s", 1515, 1400, 1600)

exit(gen.generate(PACKAGE, "cerulean_sonar_ros", "Omniscan450"))
 
