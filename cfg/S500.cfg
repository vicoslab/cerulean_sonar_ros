#!/usr/bin/env python3
PACKAGE = "cerulean_sonar_ros"

from dynamic_reconfigure.parameter_generator_catkin import *

gen = ParameterGenerator()

gen.add("ping_rate_hz", double_t, 0, "Ping rate in Hz", 0.1, 0.1, 10.0)
gen.add("use_chirp", bool_t, 0, "Use CHIRP modulation instead of monotonic pings", True)

exit(gen.generate(PACKAGE, "cerulean_sonar_ros", "S500"))
 
